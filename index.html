<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Racing V1</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#88b8e0;font-family:Arial,sans-serif}canvas{display:block}#hud{position:fixed;top:20px;left:20px;color:white;text-shadow:0 2px 5px #222;font-size:15px;pointer-events:none}#speed{font-size:38px;font-weight:800}#help{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;background:#1119;padding:11px 18px;border-radius:9px;font-size:13px;white-space:nowrap}#error{position:fixed;inset:0;background:#171717;color:white;display:none;align-items:center;justify-content:center;padding:30px;text-align:center}</style></head><body>
<div id="hud"><div id="speed">0 km/h</div><div id="status">CIRCUIT · FREE DRIVE</div></div><div id="help">W accelerate · S brake/reverse · A / D steer · R reset</div><div id="error">Three.js couldn't load. Check your internet connection and refresh.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c8ed);scene.fog=new THREE.Fog(0x91c8ed,110,260);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x718c63,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-30,65,35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-120;sun.shadow.camera.right=120;sun.shadow.camera.top=120;sun.shadow.camera.bottom=-120;scene.add(sun);
const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.85});const grass=mat(0x69a45c),asphalt=mat(0x33383b),white=mat(0xf5f4e9),red=mat(0xd74438),black=mat(0x16191c);
function box(w,h,d,m,x,y,z,parent=scene){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
box(500,.15,500,grass,0,-.13,0);
// Oval road: outer ellipse minus inner ellipse, centered on origin.
const RX=70,RZ=43,ROAD=13,N=240;const verts=[],inds=[];for(let i=0;i<=N;i++){let t=i/N*Math.PI*2;for(let r of [0,1]){const a=RX+(r?ROAD/2:-ROAD/2),b=RZ+(r?ROAD/2:-ROAD/2);verts.push(a*Math.cos(t),.025,b*Math.sin(t));}}for(let i=0;i<N;i++){let j=i*2;inds.push(j,j+1,j+2,j+1,j+3,j+2)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(inds);geo.computeVertexNormals();const road=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x383b40,side:THREE.DoubleSide,roughness:1}));road.receiveShadow=true;scene.add(road);
// Dashed centerline and red/white kerbs.
for(let i=0;i<120;i++){const t=i/120*Math.PI*2;const tangent=new THREE.Vector3(-RX*Math.sin(t),0,RZ*Math.cos(t)).normalize();const a=new THREE.Vector3(RX*Math.cos(t),.055,RZ*Math.sin(t));if(i%2===0){const line=box(.24,.018,2.2,white,a.x,a.y,a.z);line.rotation.y=Math.atan2(tangent.x,tangent.z)}for(const edge of [-1,1]){const ex=(RX+edge*ROAD/2)*Math.cos(t),ez=(RZ+edge*ROAD/2)*Math.sin(t);const curb=box(1.15,.09,2.35,i%2===0?red:white,ex,.075,ez);curb.rotation.y=Math.atan2(tangent.x,tangent.z)}}
// Starting line.
for(let j=0;j<8;j++){const x=RX-ROAD/2+(j+.5)*ROAD/8;for(let k=0;k<2;k++)box(ROAD/8,.025,.85,(j+k)%2?white:black,x,.095,(k-.5)*.85)}
// A few simple trees for depth.
const trunk=mat(0x755034),leaf=mat(0x2e753c);for(let i=0;i<75;i++){let t=i*2.399,dist=100+(i%6)*8;let x=Math.cos(t)*dist,z=Math.sin(t)*dist;box(1.1,5,1.1,trunk,x,2.4,z);const crown=new THREE.Mesh(new THREE.ConeGeometry(4,11,7),leaf);crown.position.set(x,10,z);crown.castShadow=true;scene.add(crown)}
// Car points along local -Z.
const car=new THREE.Group();scene.add(car);box(2.1,.65,4.1,red,0,.78,0,car);box(1.75,.65,1.9,mat(0x242c36),0,1.35,.25,car);box(1.9,.18,.65,black,0,.65,2.05,car);box(1.9,.12,.55,black,0,.62,-2.03,car);const wheelMat=mat(0x111214);for(const x of [-1.13,1.13])for(const z of [-1.25,1.35]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.46,.46,.3,16),wheelMat);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.48,z);car.add(wheel)}for(const x of [-.7,.7]){box(.42,.18,.06,mat(0xffedb0),x,.86,-2.07,car);box(.42,.18,.06,mat(0xa32122),x,.86,2.07,car)}
let x=RX,yaw=Math.PI/2,speed=0;const keys={};function reset(){x=RX;car.position.set(RX,0,0);car.rotation.y=Math.PI/2;yaw=Math.PI/2;speed=0}reset();addEventListener('keydown',e=>{if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyR','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const clock=new THREE.Clock(),camPos=new THREE.Vector3();function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.04);let gas=keys.KeyW||keys.ArrowUp,brake=keys.KeyS||keys.ArrowDown,left=keys.KeyA||keys.ArrowLeft,right=keys.KeyD||keys.ArrowRight;let inRoad=Math.abs(Math.sqrt((car.position.x/RX)**2+(car.position.z/RZ)**2)-1)<.18;let accel=gas?22:0;if(brake)accel-=speed>1?36:15;speed+=accel*dt;if(!gas&&!brake)speed*=Math.exp(-1.15*dt);speed*=Math.exp(-(inRoad?.12:2.1)*dt);speed=THREE.MathUtils.clamp(speed,-13,48);if(Math.abs(speed)<.05)speed=0;let steer=(left?1:0)-(right?1:0);yaw+=steer*Math.min(Math.abs(speed)/13,1)*1.55*dt*Math.sign(speed);car.rotation.y=yaw;car.position.x-=Math.sin(yaw)*speed*dt;car.position.z-=Math.cos(yaw)*speed*dt;car.rotation.z=THREE.MathUtils.lerp(car.rotation.z,-steer*Math.min(Math.abs(speed)/45,1)*.055,.12);const behind=new THREE.Vector3(Math.sin(yaw)*10,6.3,Math.cos(yaw)*10);const desired=car.position.clone().add(behind);camera.position.lerp(desired,1-Math.exp(-5*dt));camera.lookAt(car.position.x,1.1,car.position.z);document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6)+' km/h';document.getElementById('status').textContent=inRoad?'CIRCUIT · FREE DRIVE':'OFF TRACK · SLOW DOWN';renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
